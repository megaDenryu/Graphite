[package]
name = "graphite-external-verification"
version = "0.1.0"
edition = "2021"
description = "Graphite のワークスペースの外にある crate から schema を使えることを実走で確かめる検証用パッケージ"
publish = false

[dependencies]
graphite = { path = "../../crates/graphite" }

# 生成物を読み込む利用側の crate が `.expect()`・`.unwrap()` を禁じていても、生成物が
# clippy を通ることを `cargo xtask check-external` で固定する (issue #48)。
[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
