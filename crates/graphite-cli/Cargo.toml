[package]
name = "graphite-cli"
version = "0.1.0"
edition = "2021"
description = "Graphite schema から通常のRustソースを生成する道具。cargo graphite generate の実体であり、xtask も同じ生成コアを使う"

[[bin]]
name = "cargo-graphite"
path = "src/main.rs"

[dependencies]
graphite-codegen = { path = "../graphite-codegen", version = "0.1.0" }
proc-macro2 = { workspace = true }
syn = { workspace = true }
